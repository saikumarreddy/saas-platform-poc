apiVersion: v1
kind: Namespace
metadata:
  name: saas-platform-poc
  labels:
    name: saas-platform-poc

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-credentials
  namespace: saas-platform-poc
type: Opaque
stringData:
  anthropic-api-key: "" # Set via kubectl or sealed secrets
  openai-api-key: ""    # Set via kubectl or sealed secrets

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: saas-platform-poc
type: Opaque
stringData:
  secret: "test-secret-key-that-is-long-enough-for-testing-purposes"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: saas-platform-poc
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: saas-platform-poc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
