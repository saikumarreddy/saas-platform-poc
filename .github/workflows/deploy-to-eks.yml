name: Deploy to EKS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push analytics image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVICE_NAME=analytics-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:analytics-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:analytics-latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:buildcache

      - name: Build and push ingestion image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVICE_NAME=ingestion-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:ingestion-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:ingestion-latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:buildcache

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name saas-platform-poc

      - name: Deploy with kubectl
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ANALYTICS_IMAGE: ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:analytics-${{ github.sha }}
          INGESTION_IMAGE: ${{ steps.login-ecr.outputs.registry }}/saas-platform-poc:ingestion-${{ github.sha }}
        run: |
          kubectl set image deployment/analytics-service analytics-service=$ANALYTICS_IMAGE -n saas-platform-poc || true
          kubectl set image deployment/ingestion-service ingestion-service=$INGESTION_IMAGE -n saas-platform-poc || true
          kubectl rollout status deployment/analytics-service -n saas-platform-poc
          kubectl rollout status deployment/ingestion-service -n saas-platform-poc

      - name: Run smoke tests
        run: |
          ALB_ENDPOINT=$(kubectl get svc -n saas-platform-poc -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
          curl -f http://$ALB_ENDPOINT/api/v1/analytics/health || exit 1
          curl -f http://$ALB_ENDPOINT/api/v1/ingestion/health || exit 1
