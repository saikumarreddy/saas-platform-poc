name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install

      - name: Run Tests
        run: mvn verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security scan
        run: mvn dependency-check:check || true

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -t saas-platform-poc:analytics-${{ github.sha }} \
            --build-arg SERVICE_NAME=analytics-service .
          docker build -t saas-platform-poc:ingestion-${{ github.sha }} \
            --build-arg SERVICE_NAME=ingestion-service .

      - name: Save Docker images
        run: |
          docker save saas-platform-poc:analytics-${{ github.sha }} | gzip > analytics-image.tar.gz
          docker save saas-platform-poc:ingestion-${{ github.sha }} | gzip > ingestion-image.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: '*.tar.gz'
